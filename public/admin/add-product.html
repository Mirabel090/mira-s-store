<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title id="page-title">Add Product | MiraStore Admin</title>

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>

  <!-- ===== TOP BAR ===== -->
  <header class="admin-topbar">
    <div class="container admin-topbar-inner">
      <a href="dashboard.html" class="logo">Oakline <small>Admin</small></a>
      <div class="admin-topbar-actions">
        <a href="../index.html" target="_blank" rel="noopener">View store</a>
        <a href="change-password.html">Change password</a>
        <a href="orders.html">Orders</a>
        <button type="button" class="btn btn-light btn-sm" id="logout-btn">Logout</button>
      </div>
    </div>
  </header>

  <main class="container admin-main">

    <div class="admin-heading">
      <h1 id="form-title">Add Product</h1>
      <a href="dashboard.html" class="link-btn">&larr; Back to products</a>
    </div>

    <div id="form-message"></div>

    <form id="product-form" class="form-card" novalidate>

      <div class="form-group">
        <label for="name">Product name</label>
        <input type="text" id="name" class="form-control" required maxlength="120" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="category">Category</label>
          <input type="text" id="category" class="form-control" list="category-list" required maxlength="50" />
          <datalist id="category-list"></datalist>
          <p class="form-hint">Pick an existing one or type a new category.</p>
        </div>

        <div class="form-group">
          <label for="price">Price (NGN)</label>
          <input type="number" id="price" class="form-control" min="1" step="1" required />
        </div>
      </div>

      <div class="form-group">
        <label for="image">Product image</label>
        <input type="file" id="image" class="form-control" accept="image/*" />
        <p class="form-hint" id="image-hint">JPG, PNG or WebP. The photo is resized automatically before upload.</p>
        <img id="image-preview" class="image-preview hidden" alt="Image preview" />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" class="form-control" maxlength="600"></textarea>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="featured" />
        <label for="featured">Show on the home page as a featured product</label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="save-btn">Publish Product</button>
        <a href="dashboard.html" class="btn btn-outline">Cancel</a>
      </div>

    </form>
  </main>

  <!-- Order matters: main.js, then admin-api.js, then this page's script -->
  <script src="../js/main.js"></script>
  <script src="../js/admin-api.js"></script>
  <script src="../js/admin-product-form.js"></script>
</body>
</html>
