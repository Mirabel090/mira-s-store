<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Login | MiraStore Furniture</title>

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="login-page">

  <main class="login-card">
    <a href="../index.html" class="logo">Oakline</a>
    <h1>Admin Login</h1>
    <p class="login-subtitle">Sign in to manage your products</p>

    <div id="login-message"></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" class="form-control" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password" />
          <button type="button" class="password-toggle" id="password-toggle">Show</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign In</button>
    </form>

    <a href="../index.html" class="login-back">&larr; Back to store</a>
  </main>

  <script src="../js/admin-login.js"></script>
</body>
</html>
