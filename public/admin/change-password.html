<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Change Password | Oakline Admin</title>

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>

  <!-- ===== TOP BAR ===== -->
  <header class="admin-topbar">
    <div class="container admin-topbar-inner">
      <a href="dashboard.html" class="logo">Oakline <small>Admin</small></a>
      <div class="admin-topbar-actions">
        <a href="dashboard.html">Products</a>
        <a href="orders.html">Orders</a>
        <a href="../index.html" target="_blank" rel="noopener">View store</a>
        <a href="change-password.html">Change password</a>
        <button type="button" class="btn btn-light btn-sm" id="logout-btn">Logout</button>
      </div>
    </div>
  </header>

  <main class="container admin-main">

    <div class="admin-heading">
      <h1>Change Password</h1>
      <a href="dashboard.html" class="link-btn">&larr; Back to products</a>
    </div>

    <div id="form-message"></div>

    <form id="password-form" class="form-card" novalidate>

      <div class="form-group">
        <label for="currentPassword">Current password</label>
        <input type="password" id="currentPassword" class="form-control" required autocomplete="current-password" />
      </div>

      <div class="form-group">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" class="form-control" required autocomplete="new-password" />
        <p class="form-hint">At least 12 characters, with letters and numbers.</p>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" class="form-control" required autocomplete="new-password" />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="save-btn">Update Password</button>
        <a href="dashboard.html" class="btn btn-outline">Cancel</a>
      </div>

    </form>
  </main>

  <!-- Order matters: main.js, then admin-api.js, then this page's script -->
  <script src="../js/main.js"></script>
  <script src="../js/admin-api.js"></script>
  <script src="../js/admin-change-password.js"></script>
</body>
</html>
