<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop | MiraStore Furniture</title>
  <meta name="description" content="Browse our full range of sofas, beds, tables and chairs." />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Mira's Funiture</a>

      <nav class="nav-links" id="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html" class="active">Shop</a>
        <a href="shop.html?category=Sofas">Sofas</a>
        <a href="shop.html?category=Beds">Beds</a>
      </nav>

      <div class="nav-actions">
        <a href="cart.html" class="cart-link">
          Cart <span class="cart-count" id="cart-count">0</span>
        </a>
        <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">&#9776;</button>
      </div>
    </div>
  </header>

  <main>
    <!-- ===== PAGE HEADER ===== -->
    <section class="page-header">
      <div class="container">
        <h1>Shop</h1>
        <p>Discover furniture made to last</p>
      </div>
    </section>

    <!-- ===== PRODUCTS ===== -->
    <section class="section">
      <div class="container">

        <!-- Search and sort -->
        <div class="shop-toolbar">
          <input
            type="search"
            id="search-input"
            class="form-control shop-search"
            placeholder="Search furniture..."
            aria-label="Search products"
          />

          <select id="sort-select" class="form-control shop-sort" aria-label="Sort products">
            <option value="default">Sort: Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name-asc">Name: A to Z</option>
          </select>
        </div>

        <!-- Category buttons (built by shop.js) -->
        <div class="category-filters" id="category-filters"></div>

        <p class="results-count" id="results-count"></p>

        <!-- Products (built by shop.js) -->
        <div class="grid grid-products" id="product-grid">
          <p class="empty-state">Loading products...</p>
        </div>

      </div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <div class="container footer-grid">
      <div>
        <a href="index.html" class="logo" style="color:#fff;">Mira's Funiture</a>
        <p class="mt-1">Modern, comfortable furniture for modern living.</p>
      </div>
      <div>
        <h4>Shop</h4>
        <ul>
          <li><a href="shop.html">All Products</a></li>
          <li><a href="shop.html?category=Sofas">Sofas</a></li>
          <li><a href="shop.html?category=Beds">Beds</a></li>
        </ul>
      </div>
      <div>
        <h4>Company</h4>
        <ul>
          <li><a href="cart.html">Cart</a></li>
          <li><a href="admin/login.html">Admin</a></li>
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      &copy; <span id="year"></span> Mira's Furniture. All rights reserved.
    </div>
  </footer>

  <!-- main.js first (shared helpers), then shop.js -->
  <script src="js/main.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
